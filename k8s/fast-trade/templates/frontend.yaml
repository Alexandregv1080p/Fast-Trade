{{- if .Values.frontend.enabled }}
{{- $c := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fast-trade.fullname" . }}-{{ $c.name }}
  labels:
    {{- include "fast-trade.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fast-trade.selectorLabels" (dict "ctx" . "component" $c.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fast-trade.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $c.name }}
    spec:
      serviceAccountName: {{ include "fast-trade.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $c.name }}
          image: {{ include "fast-trade.image" (dict "ctx" . "component" $c) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: {{ $c.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ $c.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $c.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $c.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ $c.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $c.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx precisa escrever cache, pid e temporarios
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fast-trade.fullname" . }}-{{ $c.name }}
  labels:
    {{- include "fast-trade.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  type: {{ $c.service.type }}
  ports:
    - port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fast-trade.selectorLabels" (dict "ctx" . "component" $c.name) | nindent 4 }}
{{- if $c.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fast-trade.fullname" . }}-{{ $c.name }}
  labels:
    {{- include "fast-trade.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fast-trade.fullname" . }}-{{ $c.name }}
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $c.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fast-trade.fullname" . }}-{{ $c.name }}
  labels:
    {{- include "fast-trade.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  minAvailable: {{ $c.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "fast-trade.selectorLabels" (dict "ctx" . "component" $c.name) | nindent 6 }}
{{- end }}
{{- end }}
