apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fast-trade.fullname" . }}-backend
  labels:
    {{- include "fast-trade.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.backend.name }}
data:
  DB_HOST: {{ include "fast-trade.dbHost" . | quote }}
  DB_PORT: {{ include "fast-trade.dbPort" . | quote }}
  DB_NAME: {{ include "fast-trade.dbName" . | quote }}
  # Com o Job de migration ativo, a aplicacao nao migra nada — so valida.
  # Uma unica coisa muda o schema, e ela roda antes dos pods novos subirem.
  FLYWAY_ENABLED: {{ not .Values.migrations.enabled | quote }}
  {{- range $key, $value := .Values.backend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
