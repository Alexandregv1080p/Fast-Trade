server {
    # 8080 porque a imagem nginx-unprivileged nao roda como root
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint de health para as probes do Kubernetes
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome podem ter cache longo
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida volta para o index
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
