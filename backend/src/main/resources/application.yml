spring:
  datasource:
    # Os defaults mantem o `./mvnw spring-boot:run` local funcionando sem nenhuma env var.
    # No Kubernetes esses valores vem do ConfigMap e do Secret do chart.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fasttrade}
    username: ${DB_USER:fasttrade}
    password: ${DB_PASSWORD:fasttrade123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # `validate`: o Hibernate compara as entidades com o schema e falha o boot
      # se divergirem. Quem cria e altera tabela agora e o Flyway, nunca o ORM.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Migrations versionadas em src/main/resources/db/migration
  flyway:
    # Local: a propria aplicacao migra no boot (nada muda no seu fluxo).
    # No Kubernetes o chart passa FLYWAY_ENABLED=false e um Job dedicado
    # roda as migrations antes dos pods novos subirem.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true      # adota bancos que ja existiam com ddl-auto
    baseline-version: 0
    validate-on-migrate: true

  # Graceful shutdown: da tempo das conexoes fecharem durante um rolling update
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
  shutdown: graceful

app:
  jwt:
    # DEV-ONLY: em produção defina JWT_SECRET (a app avisa no boot se estiver usando este default).
    secret: ${JWT_SECRET:4f6e8b2c9d1a7e3f5g2h8i4j6k0l2m9n1o3p5q7r2s4t6u8v0w2x4y6z8a1b3c5}
    expiration: ${JWT_EXPIRATION:604800000}  # 7 dias em ms
  # Admin inicial: sem ADMIN_PASSWORD, mantém a senha do seed (só dev). Em produção,
  # defina ADMIN_PASSWORD e a app redefine a senha do admin no boot.
  admin:
    email: ${ADMIN_EMAIL:admin@fasttrade.com}
    password: ${ADMIN_PASSWORD:}
  # Taxas da plataforma — fonte única, antes hardcoded no app Android.
  fees:
    commission-rate: ${FEES_COMMISSION_RATE:0.05}   # comissão exibida no produto
    trade-tax-rate:  ${FEES_TRADE_TAX_RATE:0.02}     # taxa de troca cobrada no pedido

  # Gateway de pagamento: Mercado Pago. Credencial NUNCA vai pro repo/app — só env/Secret.
  # Use as de TESTE (access token começa com "TEST-"); sem token, o fluxo simulado continua.
  mercadopago:
    base-url:     ${MP_BASE_URL:https://api.mercadopago.com}
    access-token: ${MP_ACCESS_TOKEN:}     # vazio = integração desligada
    public-key:   ${MP_PUBLIC_KEY:}        # vai pro app p/ tokenizar cartão

# Actuator: health/info para as probes do k8s + prometheus para métricas
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: fasttrade-api   # rotula todas as métricas com a app

logging:
  level:
    com.fasttrade: ${LOG_LEVEL:DEBUG}
    org.springframework.security: WARN
  pattern:
    # Injeta o id de correlação (X-Request-Id) em toda linha de log: "... INFO [a1b2c3d4] ..."
    level: "%5p [%X{requestId:-}]"
