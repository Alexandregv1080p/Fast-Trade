name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------- testes
  backend-test:
    name: Backend · build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        working-directory: backend
        run: ./mvnw -B verify

  frontend-test:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: build de producao
        working-directory: frontend
        run: npm run build -- --configuration=production

  android-test:
    name: Android · build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: testes unitarios + lint + build debug e release
        working-directory: android
        # lintDebug: análise estática (gate via baseline). assembleRelease roda o R8/minify.
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

  # -------------------------------------------------- secret scanning
  secret-scan:
    name: Segurança · secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks varre o histórico
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------- migrations
  migrations:
    name: Flyway · aplica migrations num Postgres real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fasttrade
          POSTGRES_USER: fasttrade
          POSTGRES_PASSWORD: fasttrade123
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fasttrade"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: migrate do zero
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:10.17.3-alpine \
            -url=jdbc:postgresql://localhost:5432/fasttrade \
            -user=fasttrade -password=fasttrade123 \
            -connectRetries=10 migrate

      # Rodar de novo tem que ser no-op. Se alguém editar uma migration já
      # aplicada, o checksum diverge e o `validate` quebra o build aqui —
      # que é exatamente o ponto de usar migrations versionadas.
      - name: valida checksums e idempotência
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:10.17.3-alpine \
            -url=jdbc:postgresql://localhost:5432/fasttrade \
            -user=fasttrade -password=fasttrade123 \
            validate migrate

  # --------------------------------------------------------- helm lint
  helm-lint:
    name: Helm · lint e template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: helm lint
        run: helm lint ./k8s/fast-trade

      - name: renderiza os manifests (valores padrao)
        run: helm template ft ./k8s/fast-trade > /dev/null

      - name: renderiza os manifests (valores locais)
        run: helm template ft ./k8s/fast-trade -f ./k8s/fast-trade/values-local.yaml > /dev/null

  # ------------------------------------------------------------ imagens
  build-images:
    name: Docker · build e push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, migrations, helm-lint]
    # Nao publica em pull request, apenas valida o build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: backend
            context: ./backend
          - app: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata das tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
